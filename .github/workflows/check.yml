name: Check and deploy
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      golden:
        description: Play the engine's whole golden corpus (minutes)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: kubb-check-${{ github.ref }}
  # A newer push cancels a stale check, but never a main run: its Deploy job
  # writes to production and must finish once it starts.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # Sitemap lastmod dates come from git history.
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The engine's whole golden corpus takes minutes, so check plays it only when
      # the engine, wasmoon or their host changed (tools/golden-due.mjs), or when the
      # run was started by hand with the box ticked. On main the base is the commit
      # before the push; elsewhere it is where the branch left main.
      - run: npm run format:check && npm run check
        env:
          KUBB_GOLDEN: ${{ inputs.golden && '1' || '' }}
          KUBB_GOLDEN_BASE: ${{ github.ref == 'refs/heads/main' && github.event.before || '' }}
      # The pitch server's Durable Object tests, in workerd (backend/pitch-server/README.md).
      - run: npm ci --prefix backend/pitch-server
      - run: npm run test:do --prefix backend/pitch-server
      - run: pipx run --spec cfn-lint==1.57.2 cfn-lint infra/site.json infra/delivery.json infra/pitches.json
      - run: npm audit --audit-level=high
  deploy:
    name: Deploy
    needs: [check]
    # Deploys only once the delivery role exists (repository variable set
    # after npm run infra:apply). Until then main checks and stops here.
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: production-deployment
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build && npm run validate:site
        env:
          KUBB_PRODUCTION: "true"
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      - run: npm run deploy
        env:
          GH_TOKEN: ${{ github.token }}
